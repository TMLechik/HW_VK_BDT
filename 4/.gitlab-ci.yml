stages:
  - test
  - generate
  - validate
variables:
  SCRIPT: "site_checker.sh"
  TEST_SCRIPT: "test_site_checker.sh"
  SITE_URL: "leshaboiko.ru"
  ATTEMPTS: "3"
  TIMEOUT: "5"

test-ubuntu:
  stage: test
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y curl bash
    - chmod +x $SCRIPT $TEST_SCRIPT
  script:
    - echo "🔧 Testing on Ubuntu..."
    - ./$TEST_SCRIPT

test-alpine:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
    - chmod +x $SCRIPT $TEST_SCRIPT
  script:
    - echo "🔧 Testing on Alpine Linux..."
    - ./$TEST_SCRIPT

generate_html:
  image: ubuntu:latest
  stage: generate
  script:
    - chmod +x ./site_checker.sh
    - ./site_checker.sh --attempt=$ATTEMPTS --output=html "$SITE_URL"
    - ls -lh check_result.html
  artifacts:
    paths:
      - check_result.html
    expire_in: 1 day
  only:
    - branches

validate_html:
  image: ubuntu:latest
  stage: validate
  dependencies:
    - generate_html
  script:
    - test -f check_result.html || (echo "Файл не найден!" && exit 1)
    - grep -q "<!DOCTYPE html>" check_result.html || (echo "DOCTYPE отсутствует" && exit 1)
    - grep -q "<table" check_result.html || (echo "Нет таблицы с результатами" && exit 1)
    - grep -qE "Сайт (доступен|недоступен)" check_result.html || (echo "Нет итогового статуса" && exit 1)
    - echo "✅ HTML-файл успешно проверен."
  artifacts:
    paths:
      - check_result.html
    expire_in: 1 day
  only:
    - branches
